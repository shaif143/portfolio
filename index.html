<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#020204" />
    <meta
      name="description"
      content="Shaif Ahamed Tamim — AI Engineer, Researcher, and Builder."
    />
    <link
      rel="canonical"
      href="https://shaif-portfolio.vercel.app"
    />
    <title>Shaif Ahamed Tamim — Portfolio</title>
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        padding: 14px;
        background: #020204;
        color: #f2f0f7;
        font-family: Arial, Helvetica, sans-serif;
      }
      main {
        position: relative;
        width: min(96vw, 183vh, 1734px);
        aspect-ratio: 1734 / 907;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,.15);
        border-radius: clamp(18px, 2.7vw, 48px);
        background: #07070b;
        box-shadow: 0 45px 140px rgba(0,0,0,.64), 0 0 90px rgba(124,60,255,.08);
      }
      img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }
      a {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        color: #c8ff4d;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: .16em;
        text-decoration: none;
        text-transform: uppercase;
      }
      a span {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border: 1px solid rgba(200,255,77,.4);
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <main>
      <img
        src="./public/og.png"
        alt="Shaif Ahamed Tamim — AI Engineer, Researcher, Builder"
      />
    </main>
    <a href="https://shaif-portfolio.vercel.app">
      Enter full portfolio <span>↗</span>
    </a>
  </body>
</html>
